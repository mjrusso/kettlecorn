name: Set up Nix and Cachix
description: Install Nix with the GitHub token and enable the Kettlecorn binary cache.
inputs:
  github-token:
    description: Token for fetching GitHub flake inputs.
    required: true
  cachix-token:
    description: Optional Cachix token for uploading build outputs.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      with:
        github_access_token: ${{ inputs.github-token }}
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: kettlecorn
        authToken: ${{ inputs.cachix-token }}
