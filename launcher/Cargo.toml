[package]
name = "kettlecorn-launcher"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata.kettlecorn]
wasmtime = "50.0.0"

[[bin]]
name = "kettlecorn-launch"
path = "src/main.rs"

[features]
default = ["http"]
http = ["dep:wasmtime-wasi-http"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.51", features = ["rt", "net", "io-util", "sync", "macros", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
wasmtime = { version = "=50.0.0", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "parallel-compilation", "component-model-async", "threads"] }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "=50.0.0", optional = true, default-features = false, features = ["p3", "default-send-request"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
