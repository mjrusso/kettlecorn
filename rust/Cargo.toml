[package]
name = "kettlecorn"
version = "0.2.0"
edition = "2024"
description = "Run Erlang and Elixir in a WebAssembly sandbox from Rust"
license = "Apache-2.0"
repository = "https://github.com/mjrusso/kettlecorn"
readme = "README.md"

[package.metadata.docs.rs]
features = ["installer"]

[[bin]]
name = "kettlecorn-launch"
path = "src/bin/kettlecorn-launch.rs"
required-features = ["cli"]

[[bench]]
name = "embedding"
harness = false

[[example]]
name = "release-install-smoke"
required-features = ["installer"]

[features]
default = ["http"]
cli = ["dep:clap", "dep:humantime", "dep:mimalloc", "tokio/signal"]
http = [
    "dep:base64",
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:percent-encoding",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:wasmtime-wasi-http",
    "dep:webpki-roots",
]
installer = ["dep:flate2", "dep:tar", "dep:ureq"]

[dependencies]
anyhow = "1"
base64 = { version = "0.23", optional = true }
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
humantime = { version = "2", optional = true }
http = { version = "1.5.0", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
libc = "0.2"
num-bigint = "0.4"
percent-encoding = { version = "2", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false, optional = true }
tempfile = "3"
tokio = { version = "1.51", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
wasmtime = { version = "=50.0.2", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "parallel-compilation", "component-model-async", "threads", "call-hook"] }
wasmtime-wasi = { version = "=50.0.2", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "=50.0.2", optional = true, default-features = false, features = ["p3"] }
webpki-roots = { version = "1", optional = true }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }

[build-dependencies]
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
strip = true
